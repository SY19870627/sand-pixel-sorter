<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#267f78" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sand Pixel" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Sand Pixel Sorter</title>
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/p9sAAAAASUVORK5CYII=" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="mobile.css" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <script defer src="app.js"></script>
    <script defer src="mobile.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Prototype</p>
          <h1>Sand Pixel Sorter</h1>
        </div>
        <div class="topbar-actions">
          <div class="remaining-chip" aria-live="polite">
            <span>剩餘沙子</span>
            <strong id="remainingValue">0</strong>
            <div id="remainingByColor" class="remaining-colors"></div>
          </div>
          <div class="money-chip" aria-live="polite">
            <span>金錢</span>
            <strong id="moneyValue">$0</strong>
          </div>
          <div class="upload-controls">
            <label class="upload-button" for="imageUploadInput">上傳圖片</label>
            <input id="imageUploadInput" class="upload-input" type="file" accept="image/*" />
            <select id="paletteSizeSelect" class="palette-select" aria-label="選擇轉換色數">
              <option value="6" selected>6 色</option>
              <option value="7">7 色</option>
              <option value="8">8 色</option>
            </select>
            <span id="uploadStatus" class="upload-status" aria-live="polite"></span>
          </div>
          <button id="gravityButton" class="gravity-button" type="button" aria-label="切換重力方向">重力 下</button>
          <button id="beltSpeedButton" class="speed-button" type="button" aria-label="調整輸送帶速度">輸送帶 x1</button>
          <button id="resetButton" class="reset-button" type="button">重置關卡</button>
          <button id="fullscreenButton" class="tool-icon-button fullscreen-button" type="button" aria-label="全螢幕" title="全螢幕" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          </button>
          <button id="menuToggle" class="tool-icon-button menu-toggle" type="button" aria-label="更多選項" aria-expanded="false">⋯</button>
        </div>
      </header>

      <main class="game-layout">
        <section class="playfield" aria-label="像素圖">
          <div class="section-title">
            <div>
              <span class="section-kicker">Pixel Grid</span>
              <h2>像素圖</h2>
            </div>
            <span id="phasePill" class="phase-pill is-hidden">進行中</span>
          </div>
          <div id="levelGallery" class="level-gallery is-hidden" aria-label="關卡圖片"></div>
          <div id="gameCanvas" class="game-canvas" data-testid="game-canvas"></div>
          <div id="completionOverlay" class="completion-overlay is-hidden" aria-live="polite">
            <div class="completion-panel">
              <span id="outcomeStatus">完成</span>
              <strong id="outcomeTitle">通關成功</strong>
              <p id="outcomeBody">所有沙子都已吸收完畢。</p>
            </div>
          </div>
        </section>

        <aside class="side-panel" aria-label="遊戲控制">
          <section class="stat-strip is-hidden" aria-label="狀態">
            <div class="stat-block">
              <span>剩餘沙粒</span>
              <strong>0</strong>
            </div>
            <div class="stat-block">
              <span>回合</span>
              <strong id="turnValue">0</strong>
            </div>
          </section>

          <section class="panel-section is-hidden">
            <div class="section-heading">桶下方可吸</div>
            <div id="availableColors" class="swatch-list"></div>
          </section>

          <section class="panel-section">
            <div class="section-heading">道具</div>
            <div id="powerPalette" class="power-palette"></div>
            <div id="powerStatus" class="power-status" aria-live="polite"></div>
          </section>

          <section class="panel-section">
            <div class="section-heading">水桶</div>
            <div id="bucketPalette" class="bucket-palette"></div>
          </section>

          <section class="message-panel is-hidden" aria-live="polite">
            <div id="messageBar" class="message-bar">選擇一個水桶開始。</div>
            <ol id="eventLog" class="event-log"></ol>
          </section>
        </aside>
      </main>
    </div>
  </body>
</html>
